# On each push and pull request: the lint check (ruff, as configured in ruff.toml), and every test suite. The suites
# need no API key and no network: teh is pointed at fake API servers on localhost (tests/fakes/).
name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The same version as locally (requirements-dev.txt), so a check that passes there passes here
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github

  unix:
    name: tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and the suites, in bash and sh
        run: python tests/e2e/run.py

  windows:
    name: tests (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only Python is needed. The suites run the model's commands in cmd, Windows PowerShell and PowerShell 7 (pwsh),
      # all three on the runner.
      - name: Unit tests and the suites
        run: python tests/e2e/run.py
